name: Feature request
description: Suggest an idea for tsov
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the workflow that's currently difficult or missing.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: If you have a specific approach in mind, describe it here. Rough is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
