name: Bug report
description: Something broke — help us fix it
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Fill in what you can — partial reports are better than none.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tsov version / commit
      placeholder: e.g. v0.1.0, or a commit hash
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. Windows 11, Python 3.12, uv 0.12
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste any relevant output. Screenshots and screen recordings are gold.
    validations:
      required: false
