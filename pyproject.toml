[project]
name = "tsov"
version = "0.1.0"
description = "the shape of voice — AI 音乐创作 agent：哼唱 → 转录 → 分析 → MIDI → 回放（原型阶段，库 + CLI 薄壳）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "noisereduce>=3.0",
    "librosa>=0.11",
    "pretty_midi>=0.2.10",
    "pyfluidsynth>=1.3.0",
    "soundfile>=0.12",
    "sounddevice>=0.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pytest>=8.0",
    "httpx>=0.28",
    "pedalboard>=0.9",
    "python-multipart>=0.0.9",
]

[project.scripts]
tsov = "tsov.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 2026-09-22 架构治理（F3）：删除 crepe/torchcrepe/basic-pitch/madmom 四个遗留依赖
# （转录后端早已只剩 game/rmvpe，tsov/tests 代码零引用；crepe 的 vendor/crepe-0.0.16 本地源已不存在）。
# 同时移除为它们服务的 [tool.uv.sources] / [tool.uv.extra-build-dependencies] / dependency-metadata
# 与 override-dependencies（numba>=0.60 / setuptools<75 / numpy<2 / scipy<1.14 四项）。
# librosa 升为直接依赖（rmvpe 后端与 tempo 估计在用；此前经 basic-pitch 传递引入）。
#
# ⚠️ 共享环境注意（GAME backend 复用本 venv，见 vendor/GAME/.venv 的 tsovvenv.pth）：
#   - torch 2.9.1+cu128：经 pytorch 索引手装、不在 uv.lock —— 禁用裸 `uv sync`（会按精确模式当 extraneous 移除）；
#     本 venv 增减一律用 `uv pip`。
#   - GAME 运行时依赖（h5py / resampy / tensorboard，及共享的 numpy<2 / scipy / librosa / sympy / matplotlib /
#     mido / tqdm）由本 venv 提供 —— 清理时勿误删。

[tool.uv]
# numpy<2：属共享环境约束（GAME requirements 声明 numpy<2.0.0，其 venv 经 tsovvenv.pth 复用本 venv 的 numpy）。
# 2026-09-22 治理实测裁定：原四项 override 中 numba>=0.60 / setuptools<75 / scipy<1.14 已摘除，唯此项保留。
# 2026-10-04 复补 scipy<1.18：scipy≥1.18 要求 numpy≥2（1.18.x 在 numpy 1.26 下 sparse/signal 导入即崩 `np.long`），
#   与之上的 numpy<2 直接冲突——全新建目录走查实测抓出（1.17.0 = 新旧兼容线；升级此项前必先解 GAME 的 numpy 约束）。
override-dependencies = ["numpy<2", "scipy<1.18"]

[tool.hatch.build.targets.wheel]
packages = ["tsov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
