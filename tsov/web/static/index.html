<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the shape of voice — 可视化宿主</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="topbar">
  <div class="brand">tsov<span class="brand-sub">可视化宿主</span></div>
  <button class="drawer-btn" id="btn-drawer-tracks" title="轨道面板（紧凑档抽屉）">☰ 轨道</button>

  <div class="group">
    <select id="project-select" title="选择工程"></select>
    <button id="btn-refresh-projects" title="刷新工程列表">⟳</button>
    <button id="btn-new-project" title="新建工程">＋ 新建</button>
    <button id="btn-import-project" title="导入 score json → 新工程（脚本直出产物回流，M-V6 批1）">📥 导入</button>
    <button id="btn-rename" title="改工程显示名（score 标题，一个 commit，可撤销）">✏️ 改名</button>
  </div>

  <div class="group transport">
    <button id="btn-play-wav" title="浏览器试听（wav 流）">▶ 试听</button>
    <button id="btn-play-host" title="后端宿主播放（sounddevice）">🔊 宿主</button>
    <button id="btn-stop" title="停止试听">⏹</button>
    <button id="btn-render" title="离线渲染 wav">渲染</button>
  </div>

  <div class="group metro-group">
    <label class="metro" title="速度（BPM：回车/失焦提交，命令层 set_tempo）">♩=<input id="tempo-input" type="number" min="20" max="400" step="0.1"></label>
    <label class="metro" title="拍号（形如 6/8 / 3/4）"><input id="sig-input" placeholder="4/4" size="4"></label>
  </div>

  <div class="group">
    <button id="btn-undo" title="撤销一步（快照栈）">↩ 撤销</button>
    <button id="btn-redo" title="重做">↪ 重做</button>
  </div>

  <div class="group">
    <span class="muted" title="缩放">缩放</span>
    <button id="btn-zoom-out" title="缩小时间轴">−</button>
    <button id="btn-zoom-in" title="放大时间轴">＋</button>
    <button id="btn-fit" title="适配整谱">适配</button>
    <select id="snap-sel" title="写谱吸附（M-V3）：新建/移动/缩放的时值对齐网格（1/8 = 半拍，1/16 = 四分之一拍）">
      <option value="0">吸附关</option>
      <option value="0.5">吸附 1/8</option>
      <option value="0.25">吸附 1/16</option>
    </select>
  </div>

  <div class="group" title="A/B 对比试听（议题 ④）：左槽选任意历史版本，右槽=HEAD；试听走 git show 缓存渲染，不动 HEAD">
    <span class="muted">版本</span>
    <select id="cmp-base" title="对比基准（旧版本，只读参考）"></select>
    <span id="cmp-head" class="muted small">↔ HEAD</span>
    <button id="btn-cmp-listen" title="试听左槽版本（缓存渲染）">▶ 听旧版</button>
  </div>

  <div id="import-project-row" hidden>
    <select id="import-project-select" title="候选：output/ 下可导入的 score json（脚本直出产物）"></select>
    <input id="import-project-path" placeholder="或粘贴 output/ 内 json 路径（如 task2/score_task2.json）">
    <input id="import-project-name" placeholder="工程名（可改）" size="16">
    <button id="btn-import-project-confirm" title="导入并打开">导入</button>
    <button id="btn-import-project-cancel" title="收起">✕</button>
  </div>
  <button class="drawer-btn" id="btn-drawer-chat" title="对话框面板（紧凑档抽屉）">对话 ☰</button>
</header>

<section id="segbar" title="全局段轨（只读：段落/和弦；速度与拍号在顶栏）">
  <div class="seg-labels">
    <div class="seg-lb">段落</div>
    <div class="seg-lb">和弦</div>
  </div>
  <div class="seg-rows" id="seg-rows"></div>
  <div class="seg-spacer"></div>
</section>

<main id="layout">
  <aside id="tracks-panel">
    <div class="panel-title">轨道</div>
    <div id="track-list"></div>
    <div class="panel-title">乐句</div>
    <div id="segments-info" class="muted small">（无）</div>
    <div class="panel-title">工程</div>
    <div id="meta-info" class="muted small">（未打开）</div>
  </aside>

  <section id="roll-wrap">
    <canvas id="ruler"></canvas>
    <canvas id="roll"></canvas>
  </section>

  <aside id="chat-panel">
    <div id="chat-head">
      <div class="panel-title">对话框 · 语义编辑</div>
      <div id="chat-head-btns">
        <button id="btn-new-session" title="结束当前对话线程；下一轮起新会话（历史 JSONL 保留，可导入续接）">🆕 新会话</button>
        <button id="btn-import-session" title="导入历史会话：回看消息 + 接着聊">📥 导入</button>
        <button id="btn-stop-agent" title="停止当前 agent 会话（已落盘修改保留）" hidden>⏹ 停止</button>
      </div>
    </div>
    <div id="import-row" hidden>
      <select id="import-select"></select>
      <button id="btn-import-confirm">载入</button>
      <button id="btn-import-cancel">✕</button>
    </div>
    <div id="chat-log"></div>
    <div id="chat-chips">
      <select id="quick-cmd" title="快捷命令：选中即执行（LLM 语义命令 / 命令层直编）">
        <option value="">快捷命令…</option>
      </select>
      <button id="btn-quick-run" title="执行当前选中的快捷命令">执行</button>
    </div>
    <div id="ann-queue" hidden>
      <span class="muted small">待发送标注：</span>
      <span id="ann-queue-list"></span>
      <button id="btn-ann-clear" title="清空待发送标注">✕</button>
    </div>
    <div id="chat-input-row">
      <input id="chat-input" placeholder="对乐谱说点什么…（如：改成 D 多利亚调式）">
      <button id="btn-send">发送</button>
    </div>
    <div id="chat-actions">
      <button id="btn-undo-round" title="撤销最近一轮（快照栈/工程 git）">撤销本轮</button>
      <select id="rollback-select" title="选择要回滚到的版本"></select>
      <button id="btn-rollback" title="git 检出选定版本">回滚</button>
      <button id="btn-clear-diff" title="清除三色 diff 叠层">清除 diff</button>
    </div>
  </aside>
</main>

<section id="dock" title="下方面板：效果器 / 音源 / 混音台（可折叠）">
  <div class="dock-head">
    <span class="dh-title">下方面板</span>
    <button class="dock-tab active" data-pane="fx">效果器</button>
    <button class="dock-tab" data-pane="src">音源</button>
    <button class="dock-tab" data-pane="mix">混音台</button>
    <span class="dh-spacer"></span>
    <span class="dh-hint" id="dock-hint"></span>
    <button id="dock-fold" title="折叠/展开（记忆到 localStorage）" style="border:none;background:none;font-size:12px">▾ 收起</button>
  </div>
  <div id="dock-body">
    <div class="dock-pane active" id="dock-fx"></div>
    <div class="dock-pane" id="dock-src"></div>
    <div class="dock-pane" id="dock-mix"></div>
  </div>
</section>

<div id="sel-bar" hidden>
  <span id="sel-info" class="muted small"></span>
  <button data-op="pitch-1" title="选中音 -1 半音">♭ −1</button>
  <button data-op="pitch+1" title="选中音 +1 半音">♯ +1</button>
  <button data-op="oct-1" title="降八度">−8</button>
  <button data-op="oct+1" title="升八度">+8</button>
  <button data-op="vel-" title="力度 -0.1">力度 −</button>
  <button data-op="vel+" title="力度 +0.1">力度 +</button>
  <button data-op="delete" title="删除选中音（按索引降序执行）">🗑 删除</button>
  <label id="ann-mode-wrap" title="标注模式（M-V3）：选区操作先挂起为「人工标注」，随下条对话发送——确定性应用、最高优先级、不走 LLM">
    <input type="checkbox" id="ann-mode"> 标注模式
  </label>
  <button data-op="close" title="关闭工具条（保留选区）">✕</button>
</div>

<footer id="statusbar">
  <span id="status-summary" class="muted">未打开工程</span>
  <span id="status-diff"></span>
  <span id="status-error" class="error"></span>
</footer>

<script type="module" src="js/main.js"></script>
</body>
</html>
